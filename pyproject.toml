[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fejepa"
version = "2.0.0"
description = "FE-JEPA v2.0: physics-faithful, label-free FEA surrogates around an exact assembled-energy anchor (plan v2.0, 1:1)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
gen = ["scikit-fem>=9", "meshio>=5", "gmsh>=4.11"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
fejepa = "fejepa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
